name: CF Ready Scan
description: Run cf-ready scan, upload SARIF, and summarize readiness for CI or pull requests
branding:
  icon: cloud
  color: orange

inputs:
  cwd:
    description: Project directory to scan (relative to repository root)
    required: false
    default: "."
  config:
    description: Path to cf-ready.config.json (optional)
    required: false
    default: ""
  fail-on-blocker:
    description: Fail the step when blockers are found (exit code 1)
    required: false
    default: "true"
  install-from:
    description: "npm = use published @orangecloud/cf-ready via npx; source = build from cf-ready-root"
    required: false
    default: "npm"
  package-version:
    description: npm package version when install-from is npm (e.g. 0.3.2 or latest)
    required: false
    default: "0.3.2"
  cf-ready-root:
    description: Directory containing cf-ready package.json when install-from is source (defaults to action parent)
    required: false
    default: ""
  node-version:
    description: Node.js version for running cf-ready
    required: false
    default: "22"

outputs:
  exit-code:
    description: cf-ready scan exit code (0 = ready, 1 = blockers, 2 = error)
    value: ${{ steps.scan.outputs.exit_code }}
  production-ready:
    description: Whether the scan reported production ready
    value: ${{ steps.parse.outputs.production_ready }}
  blocker-count:
    description: Number of blocker findings
    value: ${{ steps.parse.outputs.blocker_count }}
  overall-score:
    description: Overall readiness score (0-100)
    value: ${{ steps.parse.outputs.overall_score }}

runs:
  using: composite
  steps:
    - name: Resolve cf-ready root
      id: roots
      shell: bash
      run: |
        if [ "${{ inputs.install-from }}" = "source" ]; then
          if [ -n "${{ inputs.cf-ready-root }}" ]; then
            ROOT="${{ inputs.cf-ready-root }}"
          else
            ROOT="${{ github.action_path }}/.."
          fi
          echo "cf_ready_root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "mode=source" >> "$GITHUB_OUTPUT"
        else
          echo "cf_ready_root=" >> "$GITHUB_OUTPUT"
          echo "mode=npm" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node.js (source build)
      if: steps.roots.outputs.mode == 'source'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ steps.roots.outputs.cf_ready_root }}/package-lock.json

    - name: Setup Node.js (npm package)
      if: steps.roots.outputs.mode == 'npm'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build cf-ready (source)
      if: steps.roots.outputs.mode == 'source'
      shell: bash
      working-directory: ${{ steps.roots.outputs.cf_ready_root }}
      run: npm ci && npm run build

    - name: Run cf-ready scan
      id: scan
      shell: bash
      run: |
        set +e
        ARGS=(scan --cwd "${{ inputs.cwd }}" --json)
        if [ -n "${{ inputs.config }}" ]; then
          ARGS+=(--config "${{ inputs.config }}")
        fi
        OUT="$RUNNER_TEMP/cf-ready-scan.json"
        if [ "${{ steps.roots.outputs.mode }}" = "source" ]; then
          node "${{ steps.roots.outputs.cf_ready_root }}/dist/index.js" "${ARGS[@]}" > "$OUT"
          CODE=$?
        else
          npx --yes "@orangecloud/cf-ready@${{ inputs.package-version }}" "${ARGS[@]}" > "$OUT"
          CODE=$?
        fi
        set -e
        echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
        cp "$OUT" cf-ready-scan.json
        if [ "$CODE" -eq 2 ]; then
          echo "::error::cf-ready scan failed with a runtime error (exit 2)"
          exit 2
        fi
        if [ "${{ inputs.fail-on-blocker }}" = "true" ] && [ "$CODE" -eq 1 ]; then
          echo "::warning::cf-ready found blockers (exit 1)"
          exit 1
        fi
        exit 0

    - name: Parse scan summary
      id: parse
      shell: bash
      run: |
        node -e "
        const fs = require('fs');
        const data = JSON.parse(fs.readFileSync('cf-ready-scan.json','utf8'));
        const blockers = (data.blockers || []).length;
        const overall = data.scores?.overall ?? 'n/a';
        const ready = data.productionReady ? 'true' : 'false';
        const out = process.env.GITHUB_OUTPUT;
        fs.appendFileSync(out, 'blocker_count=' + blockers + '\n');
        fs.appendFileSync(out, 'overall_score=' + overall + '\n');
        fs.appendFileSync(out, 'production_ready=' + ready + '\n');
        "

    - name: Upload SARIF
      if: always() && steps.scan.outputs.exit_code != '2'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.cwd }}/security-findings.sarif
        category: cf-ready
      continue-on-error: true

    - name: Upload scan JSON artifact
      if: always() && steps.scan.outputs.exit_code != '2'
      uses: actions/upload-artifact@v4
      with:
        name: cf-ready-scan
        path: cf-ready-scan.json
        retention-days: 14
